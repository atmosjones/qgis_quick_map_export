<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Map Canvas Background -->
  <rect x="2" y="2" width="28" height="28" rx="3" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Map Features: River and Park -->
  <path d="M 2 12 Q 10 12 14 20 T 16 30" fill="none" stroke="#63b3ed" stroke-width="3"/>
  <path d="M 18 2 Q 16 10 24 14 T 30 18 L 30 2 Z" fill="#9ae6b4" opacity="0.6"/>
  
  <!-- The Drawn Export Region (Red Dashed Box) -->
  <rect x="7" y="7" width="18" height="15" fill="#fc8181" fill-opacity="0.25" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="2.5 1.5"/>
  
  <!-- Selection Corner Handles -->
  <rect x="5.5" y="5.5" width="3" height="3" fill="#c53030"/>
  <rect x="23.5" y="5.5" width="3" height="3" fill="#c53030"/>
  <rect x="5.5" y="20.5" width="3" height="3" fill="#c53030"/>
  <rect x="23.5" y="20.5" width="3" height="3" fill="#c53030"/>
  
  <!-- Prominent Download / Export Arrow -->
  <path d="M 16 17.5 L 11 12.5 L 14 12.5 L 14 7.5 L 18 7.5 L 18 12.5 L 21 12.5 Z" fill="#3182ce" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Download Tray Line -->
  <path d="M 11 19.5 L 21 19.5" stroke="#3182ce" stroke-width="2" stroke-linecap="round"/>
</svg>
